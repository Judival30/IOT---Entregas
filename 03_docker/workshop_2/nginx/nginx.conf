# Reverse proxy + load balancing.
#
# - /api/products/  -> un unico backend  (solo reverse proxy + routing)
# - /api/users/     -> upstream con 2 instancias (reverse proxy + load balancing)
# - /api/orders/    -> upstream con 2 instancias (reto)

upstream users_backend {
    server users1:5000;
    server users2:5000;
}

upstream orders_backend {
    server orders1:5000;
    server orders2:5000;
}

server {
    listen 80;

    location /api/users/ {
        proxy_pass http://users_backend/;
        proxy_set_header Host $host;
    }

    location /api/products/ {
        proxy_pass http://products:5000/;
        proxy_set_header Host $host;
    }

    location /api/orders/ {
        proxy_pass http://orders_backend/;
        proxy_set_header Host $host;
    }
}
